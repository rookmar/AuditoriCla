<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Visitas y Recepciones GPON</title>
  <link rel="icon" href="/favicon.ico" />
  
  <style>
    /* --- VARIABLES ESTANDARIZADAS --- */
    :root { 
      --brand: #c62828; 
      --brand-dark: #a72b23; 
      --bg: #f6f7fb; 
      --card: #ffffff; 
      --text: #1f2a37; 
      --muted: #6b7280; 
      --border: #e5e7eb; 
      --radius: 16px; 
      --shadow: 0 10px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
      --accent: #1e40af; 
    }
    
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { 
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      padding-bottom: 80px; 
      -webkit-font-smoothing: antialiased; 
    }
    
    /* --- CABECERA ESTANDARIZADA --- */
    .appbar { background: #c62828; color: #fff; padding: 14px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.12); position: sticky; top: 0; z-index: 50; }
    .appbar .row { max-width: 1200px; margin: 0 auto; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .appbar h1 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: .2px; }
    .appbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .welcome-pill { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; padding: 8px 12px; border-radius: 999px; font-weight: 700; box-shadow: inset 0 0 12px rgba(255,255,255,.08); max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
    
    .btn-menu-header { background: #fff; color: #c62828; border: none; border-radius: 12px; padding: 8px 12px; font-weight: 800; box-shadow: 0 6px 14px rgba(255,255,255,.18); cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; font-family: inherit; transition: 0.2s; }
    .btn-menu-header:hover { filter: brightness(.98); }
    
    @media (max-width: 640px) { 
      .appbar h1 { font-size: 1.15rem; } 
      .btn-menu-header { padding: 8px 10px; } 
    }
    /* ------------------------------------------------------ */

    .container { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
    
    /* Pestañas */
    .tabs { display: flex; gap: 12px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-weight: 800; cursor: pointer; background: #fff; color: var(--muted); transition: 0.2s; font-size: 14px; }
    .tab-btn.active { background: var(--brand); color: white; border-color: var(--brand); box-shadow: 0 4px 10px rgba(198,40,40,.2); }
    
    /* Formularios */
    label { display: block; font-weight: 800; font-size: 0.75rem; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .input, .select, .textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; background: #fff; font-size: 15px; outline: none; transition: 0.2s; color: var(--text); box-sizing: border-box; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(198,40,40,.1); }
    .input:disabled, .select:disabled, .textarea:disabled { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0; }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 800; color: white; cursor: pointer; font-size: 14px; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn:active { transform: translateY(1px); }
    
    /* Diseño Dinámico NAPs */
    .medicion-row { display: grid; grid-template-columns: 1fr 1fr 1fr 40px; gap: 8px; margin-bottom: 8px; align-items: center; }
    .medicion-row input { margin-bottom: 0; padding: 12px; font-size: 14px; text-align: center; }
    .btn-remove { background: #fee2e2; color: #b91c1c; border: none; border-radius: 8px; height: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-remove:hover { background: #fecaca; }
  </style>
</head>
<body>

  <header class="appbar">
    <div class="row">
      <h1>Visitas y Recepciones</h1> 
      <div class="appbar-actions">
        <div id="welcomeText" class="welcome-pill" aria-live="polite">Cargando...</div>
        <a href="/menu.html" class="btn-menu-header">Ir a menú</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab-btn active" id="btnTabVisita" onclick="switchTab('visita')">📋 Visita Replanteo</button>
      <button class="tab-btn" id="btnTabRecepcion" onclick="switchTab('recepcion')">✅ Recepción GPON</button>
    </div>

    <div id="formVisita">
      <div class="card">
        <label>Nombre del Técnico</label>
        <input type="text" id="vis_tecnico" class="input" placeholder="Nombre completo">

        <label>Área de Trabajo <span style="color:red;">*</span></label>
        <select id="vis_area_trabajo" class="select" required>
            <option value="">Seleccione un área...</option>
            <option value="TI_VG_SC">TI_VG_SC</option>
            <option value="GV_NM_VN">GV_NM_VN</option>
        </select>
        
        <label>Asesor Inmobiliaria</label>
        <input type="text" id="vis_asesor" class="input" placeholder="Nombre del asesor">
        
        <label>Contrata que trabajará</label>
        <input type="text" id="vis_contrata" class="input" placeholder="Empresa contrata">
        
        <label>Ubicación Geográfica</label>
        <button type="button" id="vis_btnGPS" class="btn" style="background:#3b82f6; margin-bottom:12px; box-shadow: 0 4px 10px rgba(59,130,246,0.2);">📍 CAPTURAR GPS</button>
        <div id="vis_gpsData" style="font-size:13px; color:#16a34a; margin-bottom:12px; font-family:'Menlo', monospace; font-weight:800; text-align: center;"></div>
        <input type="text" id="vis_direccion" class="input" placeholder="Dirección descriptiva...">
        
        <label>Observaciones de campo</label>
        <textarea id="vis_obs" class="textarea" rows="3" placeholder="Comentarios del replanteo..."></textarea>
        
        <label>Foto de Bitácora</label>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;">
          <label for="vis_foto" class="btn btn-accion" style="background:#4b5563; text-align:center; box-shadow: 0 4px 10px rgba(75,85,99,0.2); cursor:pointer;">
            📷 ABRIR CÁMARA
          </label>
          <input type="file" id="vis_foto" accept="image/*" capture="environment" style="display: none;">
          
          <div id="vis_foto_preview_container" style="display: none; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative;">
            <img id="vis_foto_preview" src="" style="width: 100%; display: block; max-height: 400px; object-fit: contain; background: #000;">
            <button type="button" id="btnRemoverFoto" class="btn-remove btn-accion" style="position: absolute; top: 10px; right: 10px; padding: 6px 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">❌ Quitar</button>
          </div>
        </div>
        
        <button type="button" id="btnGuardarVisita" class="btn" style="background:var(--brand); box-shadow: 0 4px 12px rgba(198,40,40,.2); margin-top: 10px;">ENVIAR VISITA</button>
      </div>
    </div>

    <div id="formRecepcion" style="display:none;">
      
      <div id="banner-solo-lectura" style="display:none; background:#fee2e2; color:#991b1b; padding:14px; border-radius:12px; text-align:center; font-weight:800; margin-bottom:20px; border: 1px solid #fca5a5;">
        🔒 RECEPCIÓN FINALIZADA - MODO SOLO LECTURA
      </div>

      <div class="card" style="border-top: 4px solid var(--accent);">
        <h3 style="margin-top:0; color:var(--accent); margin-bottom: 20px;">Datos Generales del Sitio</h3>
        
        <label>Tipo de Red</label>
        <select id="rec_tipo_red" class="select">
          <option value="Balanceada">Red Balanceada</option>
          <option value="Desbalanceada">Red Desbalanceada</option>
        </select>

        <label>Área de Trabajo <span style="color:red;">*</span></label>
        <select id="rec_area_trabajo" class="select" required>
            <option value="">Seleccione un área...</option>
            <option value="TI_VG_SC">TI_VG_SC</option>
            <option value="GV_NM_VN">GV_NM_VN</option>
        </select>

        <label>Distrito</label>
        <input type="text" id="rec_distrito" class="input" placeholder="Ej: DS-01">
        
        <label>Ubicación FDH / Hub Box</label>
        <div style="display:flex; gap:10px; margin-bottom:16px;">
          <input type="text" id="rec_fdh" class="input" style="margin-bottom:0;" placeholder="Ej: Hub Principal Parque">
          <button type="button" id="rec_btnGpsFdh" class="btn btn-accion" style="background:#3b82f6; width:auto; padding:0 20px; font-size:13px;">📍 GPS</button>
        </div>
        
        <label>Lugar / Ubicación General</label>
        <input type="text" id="rec_lugar" class="input" placeholder="Ej: Condominio Las Palmas">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top: 5px;">
          <div><label>Recepciona </label><input type="text" id="rec_claro" class="input" style="margin-bottom: 0;"></div>
          <div><label>Entrega </label><input type="text" id="rec_contrata" class="input" style="margin-bottom: 0;"></div>
        </div>
      </div>

      <div id="contenedorNAPs"></div>

      <button type="button" onclick="agregarTarjetaNAP()" id="btnAñadirNAP" class="btn btn-accion" style="background:#16a34a; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(22,163,74,0.2);">
        ➕ AÑADIR CAJA NAP / ODF
      </button>

      <div id="contenedor-botones-guardado" style="display:flex; gap:10px; margin-bottom: 20px;">
        <button type="button" id="btnGuardarBorrador" class="btn btn-accion" style="background:#64748b; padding: 18px; font-size: 13px; box-shadow: 0 4px 10px rgba(100,116,139,.2); flex:1;">
          💾 GUARDAR PROGRESO (BORRADOR)
        </button>
        <button type="button" id="btnGuardarFinal" class="btn btn-accion" style="background:var(--brand); padding: 18px; font-size: 13px; box-shadow: 0 4px 12px rgba(198,40,40,.2); flex:1;">
          🚀 FINALIZAR Y ENVIAR
        </button>
      </div>

    </div>

  </main>

  <script src="/js/recepciones.js?v=8"></script>
  
  <script>
    (async () => {
      try {
        const r = await fetch('/api/me?_=' + Date.now());
        if(r.ok) {
            const d = await r.json();
            const u = d.user;
            if(u) document.getElementById('welcomeText').textContent = `Bienvenido, ${u.nombre || u.usuario}`;
        }
      } catch(e) {}
    })();
  </script>
</body>
</html>
